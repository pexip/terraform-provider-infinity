name: Deploy Infinity

on:
  workflow_call:
    inputs:
      path:
        type: string
        description: Path to the terraform code that deploys Infinity
        required: true

permissions: {}

jobs:
  install:
    name: Deploy Infinity
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Terraform variables
        shell: bash
        run: |
          echo "TF_VAR_project_id=${{ vars.DEPLOY_PROJECT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_environment=${{ vars.ENVIRONMENT || 'dev' }}" >> $GITHUB_ENV
          echo "TF_VAR_infinity_contact_email_address=${{ vars.INFINITY_CONTACT_EMAIL_ADDRESS }}" >> $GITHUB_ENV
          echo "TF_VAR_infinity_password=${{ secrets.INFINITY_ADMIN_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_infinity_license_key=${{ secrets.INFINITY_LICENSE_KEY }}" >> $GITHUB_ENV

      - name: Authenticate towards Google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
        with:
          credentials_json: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        id: init
        working-directory: ${{ inputs.path }}
        shell: bash
        run: terraform init

      - name: Terraform Format
        id: fmt
        working-directory: ${{ inputs.path }}
        shell: bash
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        working-directory: ${{ inputs.path }}
        shell: bash
        run: terraform validate -no-color
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.path }}
        shell: bash
        run: |
          terraform plan -out terraform.plan
          terraform show -no-color terraform.plan > terraform.plan.txt
        continue-on-error: true

      - name: Pull Request Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        if: github.event_name == 'pull_request'
        env:
          VALIDATION_OUTPUT: ${{ steps.validate.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prComment = require('${{ github.workspace }}/.github/scripts/terraform-pr-comment.js');

            await prComment.createOrUpdatePRComment({
              github,
              context,
              core,
              directory: '${{ inputs.path }}',
              platform: 'gcp',
              outcomes: {
                fmt: '${{ steps.fmt.outcome }}',
                init: '${{ steps.init.outcome }}',
                validate: '${{ steps.validate.outcome }}',
                trivy: 'skipped',
                plan: '${{ steps.plan.outcome }}'
              },
              validationOutput: process.env.VALIDATION_OUTPUT || ''
            });

      - name: Terraform Status
        if: steps.plan.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.init.outcome == 'failure' || steps.fmt.outcome == 'failure'
        working-directory: ${{ inputs.path }}
        shell: bash
        run: |
          echo Terraform Plan: ${{ steps.plan.outcome }}
          echo Terraform Validate: ${{ steps.validate.outcome }}
          echo Terraform Init: ${{ steps.init.outcome }}
          echo Terraform Fmt: ${{ steps.fmt.outcome }}
          exit 1

      - name: Terraform Apply
        if: ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
        working-directory: ${{ inputs.path }}
        shell: bash
        run: terraform apply -auto-approve terraform.plan
