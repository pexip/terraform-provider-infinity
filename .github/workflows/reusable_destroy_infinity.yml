name: Destroy Infinity

on:
  workflow_call:
    inputs:
      path:
        type: string
        description: Path to the terraform code that deploys Infinity
        required: true

permissions: {}

jobs:
  install:
    name: Destroy Infinity
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Terraform variables
        shell: bash
        run: |
          echo "TF_VAR_project_id=${{ vars.DEPLOY_PROJECT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_environment=${{ vars.ENVIRONMENT || 'dev' }}" >> $GITHUB_ENV
          echo "TF_VAR_infinity_contact_email_address=${{ vars.INFINITY_CONTACT_EMAIL_ADDRESS }}" >> $GITHUB_ENV
          echo "TF_VAR_infinity_password=${{ secrets.INFINITY_ADMIN_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_infinity_license_key=${{ secrets.INFINITY_LICENSE_KEY }}" >> $GITHUB_ENV

      - name: Authenticate towards Google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
        with:
          credentials_json: ${{ secrets.DEPLOY_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        id: init
        working-directory: ${{ inputs.path }}
        shell: bash
        run: terraform init

      - name: Terraform Validate
        id: validate
        working-directory: ${{ inputs.path }}
        shell: bash
        run: terraform validate -no-color
        continue-on-error: true

      - name: Terraform Destroy
        working-directory: ${{ inputs.path }}
        shell: bash
        run: terraform destroy -auto-approve
